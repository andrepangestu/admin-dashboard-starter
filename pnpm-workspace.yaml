packages:
  - apps/*
  - packages/*

# msw's postinstall only prepares its optional Service Worker assets; the worker
# is generated on demand with `msw init`, so the script is safe to skip.
allowBuilds:
  msw: false

catalog:
  '@types/node': ^26.2.0
  '@types/react': ^19.2.7
  '@types/react-dom': ^19.2.3
  react: ^19.2.8
  react-dom: ^19.2.8
  # Capped below 6.1 by typescript-eslint's peer range; TS 7 makes it throw at
  # startup, so every `eslint` run in the repo fails. The root package.json
  # references this entry too, since it owns the shared typescript-eslint install.
  typescript: ^7.0.2
